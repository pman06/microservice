services:
  account-service:
    build: ./account-service
    ports:
      - "5000:5000"
    env_file:
      - ./account-service/.env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    env_file:
      - account-service/.env.db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
