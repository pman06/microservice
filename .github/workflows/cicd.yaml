name: Account Services Pipeline
run-name: ${{ github.workflow}}- ${{ github.run_id }} by ${{ github.actor }}

on:
  push:
    branches:
      - main
      - feature/*
    paths:
      - "account-service/**"
      - ".github/workflows/cicd.yaml"
  pull_request:
    branches:
      - main
      - feature/*

defaults:
  run:
    working-directory: ./account-service

jobs:
  ci_build_test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint
      - name: Analysing the code with pylint
        run: |
          pylint $(git ls-files '*.py') --exit-zero
      - name: Run tests
        run: |
          python -m pytest
      - name: Docker build and test
        run: |
          docker build -t account-service-test .
          docker run --rm account-service-test python -m pytest
      - name: smoke test
        run: |
          sleep 10
          curl -f http://localhost:5000/health || exit 1
          docker-compose down

  deploy_dev:
    needs: ci_build_test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: deploying to dev
        run: |
          echo "Deploying to development environment"
